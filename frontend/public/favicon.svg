<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="16" />
  
  <!-- Flow Graph Symbolism: Source, Hub, Branches -->
  <!-- Connector Lines -->
  <line x1="160" y1="256" x2="256" y2="176" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" />
  <line x1="160" y1="256" x2="256" y2="336" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" />
  <line x1="256" y1="176" x2="352" y2="256" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" />
  <line x1="256" y1="336" x2="352" y2="256" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" />
  <line x1="256" y1="176" x2="256" y2="336" stroke="#2563eb" stroke-width="20" stroke-linecap="round" stroke-dasharray="16 16" />

  <!-- Node 1: Left Origin -->
  <circle cx="160" cy="256" r="44" fill="#1e293b" stroke="#3b82f6" stroke-width="16" />
  <circle cx="160" cy="256" r="20" fill="#ffffff" />

  <!-- Node 2: Top Branch -->
  <circle cx="256" cy="176" r="40" fill="#1e293b" stroke="#60a5fa" stroke-width="16" />
  <circle cx="256" cy="176" r="18" fill="#38bdf8" />

  <!-- Node 3: Bottom Branch -->
  <circle cx="256" cy="336" r="40" fill="#1e293b" stroke="#60a5fa" stroke-width="16" />
  <circle cx="256" cy="336" r="18" fill="#38bdf8" />

  <!-- Node 4: Target Merge (DevFlow Pulse) -->
  <circle cx="352" cy="256" r="50" fill="#2563eb" stroke="#93c5fd" stroke-width="12" />
  <polygon points="340,240 372,256 340,272" fill="#ffffff" />
</svg>
